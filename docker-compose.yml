services:
  sirin:
    image: ghcr.io/myrikld/sirin:latest
    build: .
    restart: unless-stopped
    environment:
      # Inside the bridge network the service cannot see the address satellites reach it at.
      - SIRIN_PUBLIC_URL=${SIRIN_PUBLIC_URL:?set it to http://<this host's LAN address>:8765}
      # Local time zone for reminders and now() in the system prompt.
      - TZ=${TZ:-UTC}
    volumes:
      - ./data:/data
    ports:
      - "8765:8765"
