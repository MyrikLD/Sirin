[project]
name = "voice-orchestrator"
version = "0.1.0"
description = "Voice pipeline for ESPHome satellites with an LLM agent and MCP tools"
requires-python = ">=3.14"
dependencies = [
    "aioesphomeapi>=46",
    "fastapi>=0.115",
    "httpx2>=2.10",
    "jinja2>=3.1",
    "pydantic-ai-slim[openai,mcp]>=2.66",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "uvicorn>=0.30",
    "wyoming>=1.6",
    "onnxruntime>=1.31.1",
    "numpy>=2.5.4",
]

[project.scripts]
voice-orchestrator = "voice_orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_orchestrator"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "BLE"]
# Catch-alls are deliberate at the edges: a probe, a pipeline run or an MCP connection must report any failure
# to the page or the device instead of crashing the service.
ignore = ["BLE001"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
