# For the alembic command line only, e.g. `alembic revision --autogenerate -m "..."`; at run time sirin migrates
# its own database at start (Database.migrate).
[alembic]
script_location = %(here)s/src/sirin/migrations
sqlalchemy.url = sqlite:///%(here)s/data/sirin.db

[post_write_hooks]
hooks = ruff_check, ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
